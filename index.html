<!doctype html><html><head><meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111318"><title>HYROX Race Timer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;overflow-x:hidden}body{margin:0;background:#111318;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}main{width:100%;max-width:560px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:21px;margin:0}.wake{font-size:11px;color:#63d391}.clock{margin-top:12px;background:#090b0e;border:1px solid #30343d;border-radius:16px;padding:16px;text-align:center}.total{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums}.current{font-size:19px;font-weight:800;margin-top:8px}.sub{font-size:13px;color:#9da3ae;margin-top:3px}.pace{font-size:18px;color:#ff6b35;font-weight:800;margin-top:8px;height:22px}.target{margin-top:10px;background:#22262f;padding:10px;border-radius:10px;font-size:14px}.target b{color:#ff6b35}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:11px 0}.buttons button{border:0;border-radius:12px;padding:17px 12px;min-height:56px;font-size:17px;font-weight:800;touch-action:manipulation;cursor:pointer}.start{background:#ff6b35}.finish{background:#63d391}.buttons button:disabled{opacity:.35}.secondary{background:#292e37;color:#fff}.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:11px}.metric{background:#1b1e25;border:1px solid #30343d;border-radius:11px;text-align:center;padding:9px}.metric strong{display:block;font-size:18px}.metric span{font-size:10px;color:#9da3ae;text-transform:uppercase}.list{background:#1b1e25;border:1px solid #30343d;border-radius:13px;overflow:hidden}.row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:10px 11px;border-bottom:1px solid #30343d;align-items:center}.row:last-child{border:0}.num{color:#9da3ae;font-size:12px}.name{font-weight:800;font-size:14px}.detail{font-size:11px;color:#9da3ae;margin-top:2px}.actual{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}.actual em{display:block;font-size:11px;color:#6ea8fe;font-style:normal}.done{opacity:.7}details{margin-top:11px;background:#1b1e25;border:1px solid #30343d;border-radius:13px;padding:10px 12px}summary{font-weight:800}label{display:block;color:#9da3ae;font-size:12px;margin-top:10px}input{width:100%;margin-top:4px;background:#0d0f13;color:#fff;border:1px solid #30343d;border-radius:8px;padding:12px;font-size:17px}

.mobile-actions{display:grid;grid-template-columns:1fr;gap:12px;margin:14px 0}
.mobile-action{width:100%;min-height:72px;border:0;border-radius:16px;font-size:22px;font-weight:800;letter-spacing:.4px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.start-action{background:#fff;color:#111}
.finish-action{background:#e63946;color:#fff}
.mobile-action:active{transform:scale(.98)}
@media(min-width:700px){.mobile-actions{display:none}}
</style></head><body><main>
<div class="top"><h1>HYROX RACE TIMER</h1><div class="wake" id="wake">o Screen lock: checking</div></div>
<div class="clock"><div class="total" id="total">00:00:00</div><div class="current" id="current">READY - RUN 1</div><div class="sub" id="sub">1 km run</div><div class="pace" id="pace"></div><div class="target" id="target">Expected: <b>5:15-5:25 /km</b></div></div>
<div class="buttons"><button class="start" id="start">START RACE</button><button class="finish" id="finish" disabled>FINISH SEGMENT</button></div>
<div class="buttons"><button class="secondary" id="undo">UNDO LAST</button><button class="secondary" id="reset">RESET</button></div>
<div class="metrics"><div class="metric"><strong id="done">0/16</strong><span>segments</span></div><div class="metric"><strong id="runs">0/8</strong><span>runs</span></div><div class="metric"><strong id="project">--:--</strong><span>run target total</span></div></div>
<div class="list" id="list"></div>
<details><summary>Run targets</summary><label>Normal run target <input id="normal" value="05:15"></label><label>Controlled run target <input id="controlled" value="05:30"></label></details>
<div style="font-size:11px;color:#9da3ae;margin:10px 2px 0;text-align:center">For the timer, open this file in Safari or Chrome. The iPhone/iPad file preview may not run the controls.</div></main>
<script>
const S=[
['RUN','Run 1','1 km','normal'],['STATION','SkiErg','1,000 m'],['RUN','Run 2','1 km','normal'],['STATION','Sled Push','50 m - 152 kg'],
['RUN','Run 3','1 km','controlled'],['STATION','Sled Pull','50 m - 103-105 kg'],['RUN','Run 4','1 km','controlled'],['STATION','Burpee Broad Jumps','80 m'],
['RUN','Run 5','1 km','normal'],['STATION','Row','1,000 m'],['RUN','Run 6','1 km','normal'],['STATION','Farmers Carry','200 m - 2x24 kg'],
['RUN','Run 7','1 km','normal'],['STATION','Sandbag Lunges','100 m - 20 kg'],['RUN','Run 8','1 km','controlled'],['STATION','Wall Balls - FINISH','100 - 6 kg']
];

let i=0, records=[], running=false, raceStart=0, segmentStart=0, timerId=null, wakeLock=null;

function $(id){return document.getElementById(id)}
function parseTime(v){
  const a=String(v).trim().split(':').map(Number);
  if(a.length===2 && a.every(Number.isFinite)) return a[0]*60+a[1];
  return Number(v)||0;
}
function clock(ms){
  let s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600); s%=3600;
  const m=Math.floor(s/60); s%=60;
  return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':');
}
function short(ms){
  let s=Math.max(0,Math.round(ms/1000));
  const m=Math.floor(s/60); s%=60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function range(key){
  const base=parseTime($(key==='normal'?'normal':'controlled').value);
  return short(base*1000)+'-'+short((base+5)*1000)+' /km';
}
function render(){
  const s=S[i];
  if(!s){
    $('current').textContent='FINISHED - WALL BALLS COMPLETE';
    $('sub').textContent='Race complete';
    $('target').textContent='HYROX SIM COMPLETE';
  }else{
    $('current').textContent=(running?'':'READY - ')+s[1].toUpperCase();
    $('sub').textContent=s[2];
    if(s[0]==='RUN'){
      $('target').innerHTML='Expected: <b>'+range(s[3])+'</b>';
    }else{
      $('target').innerHTML='Station: <b>'+s[2]+'</b>';
    }
  }

  $('done').textContent=records.length+'/16';
  $('runs').textContent=records.filter(r=>r.type==='RUN').length+'/8';

  let targetRunTotal=0;
  S.forEach(s=>{
    if(s[0]==='RUN'){
      targetRunTotal+=parseTime($(s[3]==='normal'?'normal':'controlled').value)*1000;
    }
  });
  $('project').textContent=short(targetRunTotal);

  $('list').innerHTML=S.map((s,n)=>{
    const r=records[n];
    const detail=s[0]==='RUN'?'Expected '+range(s[3]):s[2];
    let actual=r?short(r.ms):'-';
    let pace=(r && s[0]==='RUN')?'<em>'+r.pace.toFixed(2).replace('.',':')+'/km</em>':'';
    return '<div class="row '+(r?'done':'')+'">'+
      '<div class="num">'+(n+1)+'</div>'+
      '<div><div class="name">'+s[1]+'</div><div class="detail">'+detail+'</div></div>'+
      '<div class="actual">'+actual+pace+'</div></div>';
  }).join('');
}
function tick(){
  if(!running) return;
  $('total').textContent=clock(performance.now()-raceStart);
  if(S[i] && S[i][0]==='RUN'){
    $('pace').textContent='Live pace: '+short(performance.now()-segmentStart)+'/km';
  }
  timerId=requestAnimationFrame(tick);
}
async function keepScreenOn(){
  if(!('wakeLock' in navigator)){
    $('wake').textContent='o Screen lock unavailable';
    return;
  }
  try{
    wakeLock=await navigator.wakeLock.request('screen');
    $('wake').textContent='o Screen lock: ON';
    wakeLock.addEventListener('release',function(){
      $('wake').textContent='o Screen lock: OFF';
    });
  }catch(e){
    $('wake').textContent='o Screen lock unavailable';
  }
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible' && running) keepScreenOn();
});

$('start').addEventListener('click',async function(){
  if(running) return;
  if(i>=S.length){i=0;records=[];}
  running=true;
  const now=performance.now();
  raceStart=now;
  segmentStart=now;
  $('start').disabled=true;
  $('finish').disabled=false;
  $('finish').textContent='FINISH SEGMENT';
  $('pace').textContent='';
  render();
  await keepScreenOn();
  tick();
});

$('finish').addEventListener('click',function(){
  if(!running || !S[i]) return;

  const now=performance.now();
  const ms=now-segmentStart;
  const s=S[i];
  const pace=s[0]==='RUN' ? ms/60000 : null;

  records.push({type:s[0],ms:ms,pace:pace});
  i++;

  if(i>=S.length){
    running=false;
    cancelAnimationFrame(timerId);
    $('finish').disabled=true;
    $('start').disabled=false;
    $('total').textContent=clock(now-raceStart);
    $('pace').textContent='';
    render();
    return;
  }

  segmentStart=now;
  $('pace').textContent='';
  render();
});

$('undo').addEventListener('click',function(){
  if(running || records.length===0) return;
  records.pop();
  i=Math.max(0,i-1);
  render();
});

$('reset').addEventListener('click',function(){
  running=false;
  cancelAnimationFrame(timerId);
  i=0;
  records=[];
  $('total').textContent='00:00:00';
  $('pace').textContent='';
  $('start').disabled=false;
  $('finish').disabled=true;
  render();
});

$('normal').addEventListener('input',render);
$('controlled').addEventListener('input',render);

render();
</script>
<script>
(function(){
  function wire(id, targetId){
    var a=document.getElementById(id), b=document.getElementById(targetId);
    if(a && b){
      a.addEventListener('pointerup', function(e){
        e.preventDefault();
        b.click();
      }, {passive:false});
      a.addEventListener('touchend', function(e){
        e.preventDefault();
        b.click();
      }, {passive:false});
    }
  }
  wire('mobileStart','startBtn');
  wire('mobileFinish','finishBtn');

  // Prevent accidental double-taps/zoom on the large timer controls.
  document.addEventListener('dblclick', function(e){
    if(e.target && e.target.closest && e.target.closest('.mobile-action')){
      e.preventDefault();
    }
  }, {passive:false});
})();
</script>
</body></html>
